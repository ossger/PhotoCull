name: Build macOS app

on:
  workflow_dispatch: {}

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker (raw + ml extras) and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "apps/worker[raw,ml]"
          python -m pip install pyinstaller

      - name: Freeze the Python worker
        run: ./packaging/build-worker.sh

      - name: Install JS deps
        run: npm install

      - name: Build + package the Electron app
        run: npm run dist

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCull-mac
          path: apps/shell/dist/**/*.dmg
          if-no-files-found: error
