[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photocull-worker"
version = "0.4.1"
description = "Python sidecar for the PhotoCull desktop app — RAW decode, EXIF, scene detection, AI scoring, XMP export."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "Pillow>=10.2",
    "piexif>=1.1.3",
    "imagehash>=4.3.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
# Phase 3+ dependencies. Pinned loosely; install when you reach each phase.
raw = ["rawpy>=0.20"]
ml = [
    # Upper-bounded: 1.0.0/1.0.1 regressed on macOS/Metal — FaceLandmarker's
    # internal short-range face detector aborts (SIGABRT, graph_service.h
    # "Check failed: service_ Service is unavailable") building its GPU
    # calculator, even with BaseOptions.Delegate.CPU forced on the outer
    # options. 0.10.14 (this repo's original floor) confirmed clean on
    # macOS 26.5.2/arm64 — both graph construction and a real detect_rgb()
    # pass. Re-test before lifting this cap.
    "mediapipe>=0.10.14,<1.0",
    "onnxruntime>=1.17",
]
api = [
    "anthropic>=0.25",
    "google-cloud-vision>=3.7",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "httpx>=0.27",
]

[project.scripts]
photocull-worker = "photocull.server:cli"
photocull-organize = "photocull.organize:cli"
photocull-doctor = "photocull.doctor:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["photocull*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rather than whatever the installed ruff defaults to, so the lint
# result doesn't change with the ruff version. DTZ is deliberately off:
# capture times are the camera's naive wall-clock EXIF values, and the mtime
# fallbacks must stay naive too so the two compare consistently.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE", "PLW1510"]
# RUF046: round() of numpy scalars isn't always a Python int, so the int() casts stay.
# Long lines are left to the author's judgement; B905 and the ambiguous-unicode
# rules fire on idioms used on purpose (zip of equal-length lists, "×" in docs).
ignore = ["E501", "B905", "RUF046", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
# Without this, a bare `pytest` also collects from dist-bin/ and build/ (the
# PyInstaller freeze outputs of packaging/build-worker.*, gitignored but very
# commonly present locally) — mediapipe vendors its own test suite, which
# fails to import outside a frozen bundle and aborts collection entirely.
testpaths = ["tests"]
