[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photocull-worker"
version = "0.0.1"
description = "Python sidecar for the PhotoCull desktop app — RAW decode, EXIF, scene detection, AI scoring, XMP export."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "Pillow>=10.2",
    "piexif>=1.1.3",
    "imagehash>=4.3.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
# Phase 3+ dependencies. Pinned loosely; install when you reach each phase.
raw = ["rawpy>=0.20"]
ml = [
    "mediapipe>=0.10.14",
    "onnxruntime>=1.17",
]
api = [
    "anthropic>=0.25",
    "google-cloud-vision>=3.7",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "httpx>=0.27",
]

[project.scripts]
photocull-worker = "photocull.server:cli"
photocull-organize = "photocull.organize:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["photocull*"]

[tool.ruff]
line-length = 100
target-version = "py311"
